<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">

  <!-- Google Font used by the style guide -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Advice generator app</title>
</head>
<body>

  <main class="card">
    <h1 class="advice-label">Advice #<span id="advice-id">...</span></h1>

    <!-- aria-live makes screen readers announce the new advice when it changes -->
    <p class="advice-text" id="advice-text" aria-live="polite">Loading...</p>

    <div class="divider">
      <span class="line"></span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="1" width="4" height="14" rx="2" fill="hsl(193, 38%, 86%)"/>
        <rect x="11" y="1" width="4" height="14" rx="2" fill="hsl(193, 38%, 86%)"/>
      </svg>
      <span class="line"></span>
    </div>

    <button class="dice-button" id="dice-button" aria-label="Get new advice">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="5" fill="hsl(218, 23%, 16%)"/>
        <circle cx="7.5" cy="7.5" r="1.8" fill="hsl(150, 100%, 66%)"/>
        <circle cx="16.5" cy="7.5" r="1.8" fill="hsl(150, 100%, 66%)"/>
        <circle cx="12" cy="12" r="1.8" fill="hsl(150, 100%, 66%)"/>
        <circle cx="7.5" cy="16.5" r="1.8" fill="hsl(150, 100%, 66%)"/>
        <circle cx="16.5" cy="16.5" r="1.8" fill="hsl(150, 100%, 66%)"/>
      </svg>
    </button>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

  <script src="./script.js"></script>
</body>
</html>
